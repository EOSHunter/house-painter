name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (core, fixtures, palette, schemes, pages)
        run: npm test
      - name: The production build (dist/) builds
        run: npm run build
